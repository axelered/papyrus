[project]
name = "papyrus-sdk"
dynamic = ["version"]
description = "Python client for Papyrus, the self-hosted document processing API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Axelered", email = "oss@axelered.com" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]
classifiers = ["Typing :: Typed"]

[project.urls]
Homepage = "https://axelered.com"
Documentation = "https://docs.axelered.com/papyrus"
Repository = "https://github.com/axelered/papyrus"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "papyrus_sdk/version.py"

# tests need a running server (adr/sdk-python.md)
[tool.hatch.build.targets.sdist]
exclude = ["/test"]

[dependency-groups]
dev = ["pytest>=8"]

# PAPYRUS_BASE_URL and PAPYRUS_API_KEY name the server under test (adr/sdk-python.md)
[tool.pytest.ini_options]
testpaths = ["test"]
