[project]
name = "papyrus-sdk"
dynamic = ["version"]
description = "Python client for Papyrus, the self-hosted document processing API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Axelered" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]
classifiers = ["Typing :: Typed"]

[project.urls]
Documentation = "https://docs.axelered.com/papyrus"
Repository = "https://github.com/axelered/papyrus"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "papyrus_sdk/version.py"
