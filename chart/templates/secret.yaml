{{- if not .Values.apiKey.existingSecret }}
{{- $name := include "papyrus.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "papyrus.labels" . | nindent 4 }}
  annotations:
    # uninstall keeps the Secret, so a reinstall reuses the generated key (adr/chart.md)
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.apiKey.value }}
  api-key: {{ .Values.apiKey.value | b64enc | quote }}
  {{- else if and $existing (index ($existing.data | default dict) "api-key") }}
  api-key: {{ index $existing.data "api-key" | quote }}
  {{- else }}
  api-key: {{ printf "key_%s" (randAlphaNum 32) | b64enc | quote }}
  {{- end }}
{{- end }}
