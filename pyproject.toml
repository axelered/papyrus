[project]
name = "papyrus"
version = "0.0.0"
description = "Your single point stop for Agentic document processing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "charset-normalizer>=3.5.2",
    "chonkie[code]>=1.7.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "magika>=1.0.3",
    "markitdown[docx,outlook,pdf,pptx,xls,xlsx]>=0.1.9",
    "pebble>=5.2.3",
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "s3fs>=2026.9.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.163.1",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = [".", "sdk"]
# the image runs `pytest -m "full or not full"` to include full tests (adr/development.md)
addopts = "-m 'not full'"
markers = ["full: needs the dev image (LibreOffice), deselected on the host"]
