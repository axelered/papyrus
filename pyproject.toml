[project]
name = "papyrus"
version = "0.0.0"
description = "Your single point stop for Agentic document processing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.163.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
