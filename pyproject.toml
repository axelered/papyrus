[project]
name = "papyrus"
version = "0.0.0"
description = "Your single point stop for Agentic document processing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "charset-normalizer>=3.5.2",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "magika>=1.0.3",
    "markitdown[docx,outlook,pdf,pptx,xls,xlsx]>=0.1.9",
    "pebble>=5.2.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "s3fs>=2026.9.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.163.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
