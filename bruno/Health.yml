info:
  name: Health
  type: http
  seq: 7

http:
  method: GET
  url: "{{host}}/health"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs:
  content: |-
    Liveness probe: returns `200` while the server process is up, however busy it is. No API key needed.

    Point your orchestrator's liveness check here, so a replica is restarted only when it stops answering. Route traffic with `/ready` instead.
  type: text/markdown

examples:
  - name: Server is alive
    description: The process answers requests.
    request:
      url: "{{host}}/health"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "status": "ok"
          }
