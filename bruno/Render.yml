info:
  name: Render
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/v1/render"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - sample.pdf
        contentType: application/pdf
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs:
  content: |-
    Renders one page of a document, or one frame of an image, at a readable size for vision models and document viewers. Size it with `dpi` or with `width` and `height`, never both; by default the response body is the image file.

    Use thumbnail for fixed size previews, and screenshot for web pages as a browser shows them.
  type: text/markdown

examples:
  - name: Render a page as JSON
    description: Return the image as base64 in `result.content`. `source.pageCount` is the length of the document and `options` shows the default `dpi` that was applied.
    request:
      url: "{{host}}/v1/render"
      method: POST
      body:
        type: multipart-form
        data:
          - name: metadata
            type: text
            value: '{"output": "json"}'
            contentType: application/json
          - name: file
            type: file
            value:
              - sample.pdf
            contentType: application/pdf
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "file://file",
              "name": "sample.pdf",
              "size": 18810,
              "mimeType": "application/pdf",
              "extension": "pdf",
              "label": "pdf",
              "group": "document",
              "pageCount": 1
            },
            "result": {
              "name": "sample-1.png",
              "size": 397384,
              "mimeType": "image/png",
              "extension": "png",
              "label": "png",
              "group": "image",
              "width": 1275,
              "height": 1650,
              "encoding": "base64",
              "content": "iVBORw0KGgoAAAANSUhEUgAABPsAAAZyCAIAAADJpnZZ…"
            },
            "options": { "page": 1, "dpi": 150, "format": "png" }
          }
  - name: Render at a fixed width
    description: Set `width` for a predictable layout; the height follows the page aspect ratio.
    request:
      url: "{{host}}/v1/render"
      method: POST
      body:
        type: multipart-form
        data:
          - name: metadata
            type: text
            value: '{"output": "json", "options": {"width": 800, "format": "webp"}}'
            contentType: application/json
          - name: file
            type: file
            value:
              - sample.pdf
            contentType: application/pdf
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "file://file",
              "name": "sample.pdf",
              "size": 18810,
              "mimeType": "application/pdf",
              "extension": "pdf",
              "label": "pdf",
              "group": "document",
              "pageCount": 1
            },
            "result": {
              "name": "sample-1.webp",
              "size": 122152,
              "mimeType": "image/webp",
              "extension": "webp",
              "label": "webp",
              "group": "image",
              "width": 800,
              "height": 1036,
              "encoding": "base64",
              "content": "UklGRiDdAQBXRUJQVlA4IBTdAQDwZASdASogAwwE…"
            },
            "options": { "page": 1, "width": 800, "format": "webp" }
          }
  - name: Store a page in a bucket
    description: Write the image to a storage connector, here an S3 connector named `demo-s3`. The response omits `content` and `result.uri` is the stored image.
    request:
      url: "{{host}}/v1/render"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "s3://demo-s3/papyrus-test/sample.pdf",
            "destination": "s3://demo-s3/papyrus-test/sample-1.png"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "s3://demo-s3/papyrus-test/sample.pdf",
              "name": "sample.pdf",
              "size": 18810,
              "mimeType": "application/pdf",
              "extension": "pdf",
              "label": "pdf",
              "group": "document",
              "pageCount": 1
            },
            "result": {
              "uri": "s3://demo-s3/papyrus-test/sample-1.png",
              "name": "sample-1.png",
              "size": 397384,
              "mimeType": "image/png",
              "extension": "png",
              "label": "png",
              "group": "image",
              "width": 1275,
              "height": 1650
            },
            "options": { "page": 1, "dpi": 150, "format": "png" }
          }
  - name: Ask for a page past the end
    description: A `page` beyond the document fails with `page_out_of_range`; the detail reports how many pages there are.
    request:
      url: "{{host}}/v1/render"
      method: POST
      body:
        type: multipart-form
        data:
          - name: metadata
            type: text
            value: '{"options": {"page": 5}}'
            contentType: application/json
          - name: file
            type: file
            value:
              - sample.pdf
            contentType: application/pdf
    response:
      status: 422
      statusText: Unprocessable Content
      headers:
        - name: content-type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "Unprocessable Content",
            "status": 422,
            "code": "page_out_of_range",
            "detail": "page 5 is out of range, the document has 1"
          }
  - name: Combine dpi with a size
    description: "`dpi` and `width` or `height` are two ways to size the same page, so sending both fails validation."
    request:
      url: "{{host}}/v1/render"
      method: POST
      body:
        type: multipart-form
        data:
          - name: metadata
            type: text
            value: '{"options": {"dpi": 200, "width": 800}}'
            contentType: application/json
          - name: file
            type: file
            value:
              - sample.pdf
            contentType: application/pdf
    response:
      status: 422
      statusText: Unprocessable Content
      headers:
        - name: content-type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "Unprocessable Content",
            "status": 422,
            "code": "validation_error",
            "detail": "request validation failed",
            "errors": [
              { "loc": ["options"], "msg": "Value error, dpi cannot be combined with width or height", "type": "value_error" }
            ]
          }
