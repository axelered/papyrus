info:
  name: Thumbnail
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/v1/thumbnail"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - sample.pdf
        contentType: application/pdf
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs:
  content: |-
    Fits one page, image or web page into a fixed box, a 256 × 256 px WebP by default, for file lists, search results and link previews. A URL that serves HTML is captured in a browser at desktop width, so `https://axelered.com` gives a picture of the site.

    Use render when you need a page at reading size.
  type: text/markdown

examples:
  - name: Preview an uploaded PDF
    description: Return the preview as JSON. With the default `contain`, a portrait page fills the box height and the width follows.
    request:
      url: "{{host}}/v1/thumbnail"
      method: POST
      body:
        type: multipart-form
        data:
          - name: metadata
            type: text
            value: '{"output": "json"}'
            contentType: application/json
          - name: file
            type: file
            value:
              - sample.pdf
            contentType: application/pdf
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "file://file",
              "name": "sample.pdf",
              "size": 18810,
              "mimeType": "application/pdf",
              "extension": "pdf",
              "label": "pdf",
              "group": "document",
              "pageCount": 1
            },
            "result": {
              "name": "sample.webp",
              "size": 9852,
              "mimeType": "image/webp",
              "extension": "webp",
              "label": "webp",
              "group": "image",
              "width": 198,
              "height": 256,
              "encoding": "base64",
              "content": "UklGRnQmAABXRUJQVlA4IGgmAACwagCdASrGAAAB…"
            },
            "options": { "page": 1, "width": 256, "height": 256, "fit": "contain", "format": "webp" }
          }
  - name: Crop a remote image to a card
    description: "`cover` fills a 320 × 200 card and crops the center. For image sources, `source.width` and `source.height` are the original pixels."
    request:
      url: "{{host}}/v1/thumbnail"
      method: POST
      body:
        type: json
        data: |-
          {
            "output": "json",
            "source": "https://axelered.com/_og/platform.png",
            "options": { "width": 320, "height": 200, "fit": "cover" }
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "https://axelered.com/_og/platform.png",
              "name": "platform.png",
              "size": 80238,
              "mimeType": "image/png",
              "extension": "png",
              "label": "png",
              "group": "image",
              "pageCount": 1,
              "width": 1200,
              "height": 630,
              "fetch": { "url": "https://axelered.com/_og/platform.png", "status": 200 }
            },
            "result": {
              "name": "platform.webp",
              "size": 6738,
              "mimeType": "image/webp",
              "extension": "webp",
              "label": "webp",
              "group": "image",
              "width": 320,
              "height": 200,
              "encoding": "base64",
              "content": "UklGRkoaAABXRUJQVlA4ID4aAACwaQCdASpAAcgA…"
            },
            "options": { "page": 1, "width": 320, "height": 200, "fit": "cover", "format": "webp" }
          }
  - name: Preview a website
    description: A URL that serves HTML is captured in a browser at desktop width. A 4:3 box captures a 1280 × 960 viewport and scales it down.
    request:
      url: "{{host}}/v1/thumbnail"
      method: POST
      body:
        type: json
        data: |-
          {
            "output": "json",
            "source": "https://axelered.com",
            "options": { "width": 400, "height": 300 }
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "https://axelered.com",
              "name": "source.html",
              "size": 94018,
              "mimeType": "text/html",
              "extension": "html",
              "label": "html",
              "group": "markup",
              "pageCount": 1,
              "fetch": { "url": "https://axelered.com", "status": 200 }
            },
            "result": {
              "name": "source.webp",
              "size": 6872,
              "mimeType": "image/webp",
              "extension": "webp",
              "label": "webp",
              "group": "image",
              "width": 400,
              "height": 300,
              "encoding": "base64",
              "content": "UklGRtAaAABXRUJQVlA4IMQaAABwhQCdASqQASwB…"
            },
            "options": { "page": 1, "width": 400, "height": 300, "fit": "contain", "format": "webp" }
          }
  - name: Store a website preview in a bucket
    description: Write the preview to a storage connector, here an S3 connector named `demo-s3`. The response omits `content` and `result.uri` is the stored image.
    request:
      url: "{{host}}/v1/thumbnail"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "https://axelered.com",
            "destination": "s3://demo-s3/papyrus-test/axelered.webp",
            "options": { "width": 400, "height": 300 }
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "https://axelered.com",
              "name": "source.html",
              "size": 94018,
              "mimeType": "text/html",
              "extension": "html",
              "label": "html",
              "group": "markup",
              "pageCount": 1,
              "fetch": { "url": "https://axelered.com", "status": 200 }
            },
            "result": {
              "uri": "s3://demo-s3/papyrus-test/axelered.webp",
              "name": "source.webp",
              "size": 6872,
              "mimeType": "image/webp",
              "extension": "webp",
              "label": "webp",
              "group": "image",
              "width": 400,
              "height": 300
            },
            "options": { "page": 1, "width": 400, "height": 300, "fit": "contain", "format": "webp" }
          }
