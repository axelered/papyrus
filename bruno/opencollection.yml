opencollection: 1.0.0

info:
  name: Axelered Papyrus
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{token}}"
  variables:
    - name: host
      value: http://127.0.0.1:8000
      description: Base URL of your Papyrus server, the quickstart default
    - name: token
      value: dev
      description: API key, one of the values in PAPYRUS_API_KEY

docs:
  content: |-
    Papyrus turns any document or web page into LLM-ready Markdown, chunks and images, through one HTTP API that runs on your own infrastructure. Send a PDF, an Office file, an email or a URL, and get back text your model can read and images your users can see.

    Every operation is a `POST` under `/v1` that takes a `source` to process, its `options` and an optional `destination` in your storage, as JSON or as a multipart upload. Responses share one envelope describing the source and the result, and errors are `application/problem+json` with a stable `code`; the Request format and Error codes pages under Concepts cover both.

    ## Authentication

    Send `Authorization: Bearer <key>` on every `/v1` request, where the key is one of the comma separated values of `PAPYRUS_API_KEY`. A missing or wrong key returns `401 unauthorized`. `/`, `/health` and `/ready` are public. The collection's `token` variable defaults to `dev`, the key the quickstart starts the server with.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
