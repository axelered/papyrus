opencollection: 1.0.0

info:
  name: Axelered Papyrus
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{token}}"
  variables:
    - name: host
      value: http://127.0.0.1:8000
      description: Base URL of your Papyrus server, the quickstart default
    - name: token
      value: dev
      description: API key, one of the values in PAPYRUS_API_KEY

docs:
  content: |-
    Papyrus is a self-hosted HTTP API that converts documents and web pages into Markdown, chunks and images for LLM and agent pipelines. Send a PDF, an Office file, an email or a URL.

    Every operation is a `POST` under `/v1` that takes a `source` to process and its `options`, as JSON or as a multipart upload. All of them except Inspect also take an optional `destination` in your storage, and describe the source and the result in one shared envelope. Errors are `application/problem+json` with a stable `code`; the Request format and Error codes pages under Concepts cover both.

    ## Authentication

    Send `Authorization: Bearer <key>` on every `/v1` request, where the key is one of the comma separated values of `PAPYRUS_API_KEY`. A missing or wrong key returns `401 unauthorized`. `/`, `/health` and `/ready` are public. The collection's `token` variable defaults to `dev`, the key the quickstart starts the server with.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
