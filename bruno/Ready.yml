info:
  name: Ready
  type: http
  seq: 7

http:
  method: GET
  url: "{{host}}/ready"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs:
  content: |-
    Readiness probe: returns `200` while the server can accept another request, and `503 not_ready` while every `workers.max_queue` slot is in use. No API key needed.

    Point your load balancer's readiness check here to route traffic away from a replica at capacity. `/health` keeps answering `200`, so the replica is not restarted.
  type: text/markdown

examples:
  - name: Ready for requests
    description: The replica has free slots.
    request:
      url: "{{host}}/ready"
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "status": "ok"
          }
  - name: At capacity
    description: Every slot is in use; the detail reports how many requests are running.
    request:
      url: "{{host}}/ready"
      method: GET
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: content-type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "Service Unavailable",
            "status": 503,
            "code": "not_ready",
            "detail": "64 requests in flight"
          }
