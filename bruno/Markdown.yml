info:
  name: Markdown
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/v1/markdown"
  body:
    type: json
    data: |-
      {
        "source": "https://axelered.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs:
  content: |-
    Extracts Markdown from a document or web page, ready to pass to an LLM or index for retrieval. The format is detected from the content, and `options.chunking` adds structure-aware chunks sized for your embedding model, with the headings they sit under and their offsets in the Markdown.

    Set `options.readMode` to `ocr` for scanned PDFs and images: every page is read by the vision model configured on the server. The default `text` extracts the text stored in the file, so scans return little or nothing and images fail with `415 unsupported_format`, as do corrupt and encrypted files. Legacy formats such as `.doc` and `.ppt` are converted with LibreOffice first and take longer.
  type: text/markdown

examples:
  - name: Convert a web page
    description: Fetch a page and return its Markdown. `source.fetch` reports the final URL and HTTP status, `source.title` the page title.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "https://axelered.com"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "https://axelered.com",
              "name": "source.html",
              "size": 94018,
              "mimeType": "text/html",
              "extension": "html",
              "label": "html",
              "group": "markup",
              "title": "Axelered · Intelligent process automation",
              "fetch": { "url": "https://axelered.com", "status": 200 }
            },
            "result": {
              "name": "source.md",
              "size": 6810,
              "mimeType": "text/markdown",
              "extension": "md",
              "label": "markdown",
              "group": "markup",
              "encoding": "utf-8",
              "content": "[Axelered](/)[01Platform](/platform)…\n\n# Automatethe process.\n\nWe automate your processes end to end and own the outcome after go-live.…"
            },
            "options": { "readMode": "text" }
          }
  - name: Convert an uploaded PDF
    description: Upload a file as multipart. Without a `metadata` part the source is the `file` part and every option takes its default.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: multipart-form
        data:
          - name: file
            type: file
            value:
              - sample.pdf
            contentType: application/pdf
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "file://file",
              "name": "sample.pdf",
              "size": 18810,
              "mimeType": "application/pdf",
              "extension": "pdf",
              "label": "pdf",
              "group": "document"
            },
            "result": {
              "name": "sample.md",
              "size": 3092,
              "mimeType": "text/markdown",
              "extension": "md",
              "label": "markdown",
              "group": "markup",
              "encoding": "utf-8",
              "content": "Sample PDF\nThis is a simple PDF ﬁle. Fun fun fun.\n\n…"
            },
            "options": { "readMode": "text" }
          }
  - name: Read a scanned PDF
    description: Read every page with the vision model of the server. Each page starts with a marker comment and `source.pageCount` is the number of pages.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: multipart-form
        data:
          - name: metadata
            type: text
            value: '{"options": {"readMode": "ocr"}}'
            contentType: application/json
          - name: file
            type: file
            value:
              - scan.pdf
            contentType: application/pdf
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "file://file",
              "name": "scan.pdf",
              "size": 125261,
              "mimeType": "application/pdf",
              "extension": "pdf",
              "label": "pdf",
              "group": "document",
              "pageCount": 2
            },
            "result": {
              "name": "scan.md",
              "size": 392,
              "mimeType": "text/markdown",
              "extension": "md",
              "label": "markdown",
              "group": "markup",
              "encoding": "utf-8",
              "content": "<!-- Page number: 1 -->\n\nAxelered LLC\n\n# Delivery note 2026-117\n\nShipped on 12 November 2026 from Ljubljana.\n\n…\n\n| Item    | Quantity | Weight |\n|---------|----------|--------|\n| Widget  | 3        | 4.5 kg |\n| Gadget  | 1        | 1.2 kg |\n\n<!-- Page number: 2 -->\n\nAxelered LLC\n\n# Terms\n\n…"
            },
            "options": { "readMode": "ocr" }
          }
  - name: Read an image
    description: Images are read in `ocr` mode only. Animated images are read from their first frame.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "https://axelered.com/_og/platform.png",
            "options": { "readMode": "ocr" }
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "https://axelered.com/_og/platform.png",
              "name": "platform.png",
              "size": 80238,
              "mimeType": "image/png",
              "extension": "png",
              "label": "png",
              "group": "image",
              "pageCount": 1,
              "width": 1200,
              "height": 630,
              "fetch": { "url": "https://axelered.com/_og/platform.png", "status": 200 }
            },
            "result": {
              "name": "platform.md",
              "size": 81,
              "mimeType": "text/markdown",
              "extension": "md",
              "label": "markdown",
              "group": "markup",
              "encoding": "utf-8",
              "content": "<!-- Page number: 1 -->\n\naxelered\nPLATFORM\nOne platform from\nintake to write-back"
            },
            "options": { "readMode": "ocr" }
          }
  - name: Fall back to text
    description: Formats without pages, such as web pages and spreadsheets, are extracted as text. `options.readMode` in the response is the mode used.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "https://axelered.com",
            "options": { "readMode": "ocr" }
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "https://axelered.com",
              "name": "source.html",
              "size": 95359,
              "mimeType": "text/html",
              "extension": "html",
              "label": "html",
              "group": "markup",
              "title": "Axelered · Intelligent process automation",
              "fetch": { "url": "https://axelered.com", "status": 200 }
            },
            "result": {
              "name": "source.md",
              "size": 6972,
              "mimeType": "text/markdown",
              "extension": "md",
              "label": "markdown",
              "group": "markup",
              "encoding": "utf-8",
              "content": "[Axelered](/)[01Platform](/platform)…"
            },
            "options": { "readMode": "text" }
          }
  - name: Chunk a web page for embeddings
    description: Return the Markdown and chunks of at most 256 tokens. Each chunk carries the headings it sits under and its offsets in `result.content`.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "https://axelered.com",
            "options": { "chunking": { "maxTokens": 256 } }
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "https://axelered.com",
              "name": "source.html",
              "size": 94018,
              "mimeType": "text/html",
              "extension": "html",
              "label": "html",
              "group": "markup",
              "title": "Axelered · Intelligent process automation",
              "fetch": { "url": "https://axelered.com", "status": 200 }
            },
            "result": {
              "name": "source.md",
              "size": 6810,
              "mimeType": "text/markdown",
              "extension": "md",
              "label": "markdown",
              "group": "markup",
              "encoding": "utf-8",
              "content": "[Axelered](/)[01Platform](/platform)…"
            },
            "options": {
              "readMode": "text",
              "chunking": { "maxTokens": 256, "overlap": 0, "tokenizer": "o200k_base" }
            },
            "chunks": [
              {
                "index": 1,
                "kind": "text",
                "text": "# Automatethe process.\n\nWe automate your processes end to end and own the outcome after go-live.…",
                "headings": ["Automatethe process."],
                "start": 200,
                "end": 516,
                "tokens": 66
              },
              {
                "index": 2,
                "kind": "text",
                "text": "## Each step, from intake to write-back.\n\n10+10+\n\nYears in production…",
                "headings": ["Automatethe process.", "Each step, from intake to write-back."],
                "start": 516,
                "end": 849,
                "tokens": 85
              }
            ]
          }
  - name: Chunk an uploaded file
    description: Send options with an upload in the `metadata` part, as the same JSON you would post to the endpoint.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: multipart-form
        data:
          - name: metadata
            type: text
            value: '{"options": {"chunking": {"maxTokens": 512}}}'
            contentType: application/json
          - name: file
            type: file
            value:
              - sample.pdf
            contentType: application/pdf
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "file://file",
              "name": "sample.pdf",
              "size": 18810,
              "mimeType": "application/pdf",
              "extension": "pdf",
              "label": "pdf",
              "group": "document"
            },
            "result": {
              "name": "sample.md",
              "size": 3092,
              "mimeType": "text/markdown",
              "extension": "md",
              "label": "markdown",
              "group": "markup",
              "encoding": "utf-8",
              "content": "Sample PDF\nThis is a simple PDF ﬁle. Fun fun fun.\n\n…"
            },
            "options": {
              "readMode": "text",
              "chunking": { "maxTokens": 512, "overlap": 0, "tokenizer": "o200k_base" }
            },
            "chunks": [
              {
                "index": 0,
                "kind": "text",
                "text": "Sample PDF\nThis is a simple PDF ﬁle. Fun fun fun.\n\n…",
                "headings": [],
                "start": 0,
                "end": 1043,
                "tokens": 312
              }
            ]
          }
  - name: Chunk a scanned PDF
    description: Combine OCR and chunking. Each chunk carries the `page` it starts on.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: multipart-form
        data:
          - name: metadata
            type: text
            value: '{"options": {"readMode": "ocr", "chunking": {"maxTokens": 256}}}'
            contentType: application/json
          - name: file
            type: file
            value:
              - scan.pdf
            contentType: application/pdf
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "file://file",
              "name": "scan.pdf",
              "size": 125261,
              "mimeType": "application/pdf",
              "extension": "pdf",
              "label": "pdf",
              "group": "document",
              "pageCount": 2
            },
            "result": {
              "name": "scan.md",
              "size": 392,
              "mimeType": "text/markdown",
              "extension": "md",
              "label": "markdown",
              "group": "markup",
              "encoding": "utf-8",
              "content": "<!-- Page number: 1 -->\n\nAxelered LLC\n\n# Delivery note 2026-117\n\n…"
            },
            "options": {
              "readMode": "ocr",
              "chunking": { "maxTokens": 256, "overlap": 0, "tokenizer": "o200k_base" }
            },
            "chunks": [
              {
                "index": 2,
                "kind": "table",
                "text": "| Item    | Quantity | Weight |\n|---------|----------|--------|\n| Widget  | 3        | 4.5 kg |\n| Gadget  | 1        | 1.2 kg |\n",
                "headings": ["Delivery note 2026-117"],
                "page": 1,
                "start": 146,
                "end": 274,
                "tokens": 43
              },
              {
                "index": 4,
                "kind": "text",
                "text": "# Terms\n\nReport missing items within 8 days.\n\nReturns need a written approval.",
                "headings": ["Terms"],
                "page": 2,
                "start": 314,
                "end": 392,
                "tokens": 17
              }
            ]
          }
  - name: Store Markdown in a bucket
    description: Read from and write to a configured storage connector, here an S3 connector named `demo-s3`. The response omits `content` and `result.uri` is the stored file.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "s3://demo-s3/papyrus-test/sample.pdf",
            "destination": "s3://demo-s3/papyrus-test/sample.md"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "s3://demo-s3/papyrus-test/sample.pdf",
              "name": "sample.pdf",
              "size": 18810,
              "mimeType": "application/pdf",
              "extension": "pdf",
              "label": "pdf",
              "group": "document"
            },
            "result": {
              "uri": "s3://demo-s3/papyrus-test/sample.md",
              "name": "sample.md",
              "size": 3092,
              "mimeType": "text/markdown",
              "extension": "md",
              "label": "markdown",
              "group": "markup"
            },
            "options": { "readMode": "text" }
          }
  - name: Store chunks in a bucket
    description: With chunking and a destination, the full JSON document is uploaded and the response describes the stored `.json` file, without chunks.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "s3://demo-s3/papyrus-test/sample.pdf",
            "destination": "s3://demo-s3/papyrus-test/sample.json",
            "options": { "chunking": { "maxTokens": 256 } }
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "source": {
              "uri": "s3://demo-s3/papyrus-test/sample.pdf",
              "name": "sample.pdf",
              "size": 18810,
              "mimeType": "application/pdf",
              "extension": "pdf",
              "label": "pdf",
              "group": "document"
            },
            "result": {
              "uri": "s3://demo-s3/papyrus-test/sample.json",
              "name": "sample.json",
              "size": 7251,
              "mimeType": "application/json",
              "extension": "json",
              "label": "json",
              "group": "data"
            },
            "options": {
              "readMode": "text",
              "chunking": { "maxTokens": 256, "overlap": 0, "tokenizer": "o200k_base" }
            }
          }
  - name: Name an unknown connector
    description: Storage URIs must name a connector from the server configuration; any other name fails before anything is read.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "s3://demo-s3/papyrus-test/sample.pdf"
          }
    response:
      status: 422
      statusText: Unprocessable Content
      headers:
        - name: content-type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "Unprocessable Content",
            "status": 422,
            "code": "unknown_connector",
            "detail": "connector 'demo-s3' is not configured"
          }
  - name: Reject an image
    description: Images have no stored text, so they fail with `unsupported_format` in the default `text` mode. Set `readMode` to `ocr` to read them.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "https://axelered.com/_og/platform.png"
          }
    response:
      status: 415
      statusText: Unsupported Media Type
      headers:
        - name: content-type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "Unsupported Media Type",
            "status": 415,
            "code": "unsupported_format",
            "detail": "image/png (png) is not supported for markdown extraction, set readMode to ocr to read images"
          }
  - name: Use OCR without a backend
    description: Servers without an `ocr` section in their configuration reject `ocr` mode before reading the source.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "https://axelered.com",
            "options": { "readMode": "ocr" }
          }
    response:
      status: 422
      statusText: Unprocessable Content
      headers:
        - name: content-type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "Unprocessable Content",
            "status": 422,
            "code": "ocr_not_configured",
            "detail": "readMode ocr needs an OCR backend, this server has none"
          }
  - name: Exceed the page limit
    description: Documents over the page limit of the server fail before any page is read.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "s3://demo-s3/papyrus-test/long.pdf",
            "options": { "readMode": "ocr" }
          }
    response:
      status: 413
      statusText: Content Too Large
      headers:
        - name: content-type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "Content Too Large",
            "status": 413,
            "code": "too_many_pages",
            "detail": "the document has 4 pages, at most 3 can be read"
          }
  - name: Reject snake_case keys
    description: Field names are camelCase only. Any other spelling is an unknown field and `errors[].loc` points at it.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "https://axelered.com",
            "options": { "chunking": { "max_tokens": 512 } }
          }
    response:
      status: 422
      statusText: Unprocessable Content
      headers:
        - name: content-type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "Unprocessable Content",
            "status": 422,
            "code": "validation_error",
            "detail": "request validation failed",
            "errors": [
              { "loc": ["options", "chunking", "max_tokens"], "msg": "Extra inputs are not permitted", "type": "extra_forbidden" }
            ]
          }
  - name: Block a private address
    description: URLs that resolve to private or internal addresses are refused before any request is sent, unless the server sets `http.allow_private`.
    request:
      url: "{{host}}/v1/markdown"
      method: POST
      body:
        type: json
        data: |-
          {
            "source": "http://127.0.0.1/admin"
          }
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: content-type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
            "type": "about:blank",
            "title": "Forbidden",
            "status": 403,
            "code": "source_forbidden",
            "detail": "host '127.0.0.1' resolves to a non-public address"
          }
