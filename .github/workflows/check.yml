# Builds the dev image and runs lint and the full test suite inside it (adr/development.md).
# Release tags vX.Y.Z also publish the runtime image to GHCR and create a GitHub release.
name: check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      changelog: ${{ steps.semver.outputs.changelog }}
    steps:
      - uses: actions/checkout@v5

      # always preview: a vX.Y.Z tag at HEAD gives that version, anything else X.Y.Z-rcN, never pushes tags
      - name: Version
        id: semver
        uses: svaraborut/semver@v2
        with:
          preview: true
          files: server/version.py

      - name: Watermark
        id: watermark
        uses: svaraborut/watermark@v2
        with:
          version: ${{ steps.semver.outputs.version }}
          format: 'vVERSION #SHA7 DATE'

      # tag runs only: a push to main at an already tagged commit must not publish twice
      - name: Publish decision
        id: publish
        run: echo "publish=${{ startsWith(github.ref, 'refs/tags/v') && steps.semver.outputs.prerelease == 'false' }}" >> "$GITHUB_OUTPUT"

      # commit subjects are untrusted, they reach the shell only through env
      - name: Summary
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          WATERMARK: ${{ steps.watermark.outputs.watermark }}
          CHANGELOG: ${{ steps.semver.outputs.changelog }}
        run: printf '## %s\n\n`%s`\n\n%s\n' "$VERSION" "$WATERMARK" "$CHANGELOG" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: papyrus:dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      - name: Format
        run: docker run --rm -v ./server:/app/server:ro -v ./test:/app/test:ro -v ./scripts:/app/scripts:ro -v ./ruff.toml:/app/ruff.toml:ro papyrus:dev ruff format --check

      - name: Lint
        run: docker run --rm -v ./server:/app/server:ro -v ./test:/app/test:ro -v ./scripts:/app/scripts:ro -v ./ruff.toml:/app/ruff.toml:ro papyrus:dev ruff check

      # -m overrides the `not full` addopts filter, without it the LibreOffice tests are silently deselected
      - name: Test
        run: docker run --rm --init -v ./server:/app/server:ro -v ./test:/app/test:ro -v ./scripts:/app/scripts:ro papyrus:dev pytest -m "full or not full"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GHCR
        if: steps.publish.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # always built so a broken prod image fails the check, pushed only on release
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.publish.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: WATERMARK=${{ steps.watermark.outputs.watermark }}
          cache-from: |
            type=gha,scope=dev
            type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

  # only this job can write to the repository, and it runs once the image is pushed
  release:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          body: |
            Automated container release.
            
            ### Changelog
            ${{ needs.build.outputs.changelog }}

            Image: `ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}`
