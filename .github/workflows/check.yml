# Builds the dev image and runs lint and the full test suite inside it (adr/development.md).
# Tags v* also publish the runtime image to GHCR.
name: check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: papyrus:dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      - name: Format
        run: docker run --rm -v ./server:/app/server:ro -v ./test:/app/test:ro -v ./scripts:/app/scripts:ro -v ./ruff.toml:/app/ruff.toml:ro papyrus:dev ruff format --check

      - name: Lint
        run: docker run --rm -v ./server:/app/server:ro -v ./test:/app/test:ro -v ./scripts:/app/scripts:ro -v ./ruff.toml:/app/ruff.toml:ro papyrus:dev ruff check

      # -m overrides the `not full` addopts filter, without it the LibreOffice tests are silently deselected
      - name: Test
        run: docker run --rm --init -v ./server:/app/server:ro -v ./test:/app/test:ro -v ./scripts:/app/scripts:ro papyrus:dev pytest -m "full or not full"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # always built so a broken prod image fails the check, pushed only for v* tags
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=dev
            type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
