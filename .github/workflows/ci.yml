# Checks every change on main: server first, then the SDKs against it (adr/development.md)
name: ci

on:
  workflow_dispatch:
#  push:
#    branches: [main]
#  pull_request:

# superseded pull request runs are cancelled, every main commit gets a full status
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  server:
    uses: ./.github/workflows/_server.yml

  sdk-python:
    needs: server
    uses: ./.github/workflows/_sdk_python.yml

  sdk-typescript:
    needs: server
    uses: ./.github/workflows/_sdk_typescript.yml
