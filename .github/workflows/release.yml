# Release on demand: checks, tag, image and SDK publishes, GitHub release (adr/development.md, Release)
name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Show the next version and changelog, tag and publish nothing
        type: boolean
        default: false

# never cancelled: two releases must not race for the same tag
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # releases come from main only, every later job needs this one
  server:
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/_server.yml

  sdk-python:
    needs: server
    uses: ./.github/workflows/_sdk_python.yml

  sdk-typescript:
    needs: server
    uses: ./.github/workflows/_sdk_typescript.yml

  # tagged only after every check passed on this commit, so a red run leaves no tag behind
  tag:
    needs: [server, sdk-python, sdk-typescript]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      changelog: ${{ steps.semver.outputs.changelog }}
    steps:
      - uses: actions/checkout@v5

      # every release is a minor bump: breaking changes cannot reach 1.0.0, patches need minimum-bump: patch
      - id: semver
        uses: svaraborut/semver@v3
        with:
          preview: ${{ inputs.dry-run }}
          minimum-bump: minor
          maximum-bump: minor
          aliases: ''

      # commit subjects are untrusted, they reach the shell only through env
      - name: Summary
        env:
          TAG: ${{ steps.semver.outputs.tag }}
          CHANGELOG: ${{ steps.semver.outputs.changelog }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = true ]; then title="Dry run: $TAG, nothing tagged or published"; else title="$TAG"; fi
          printf '## %s\n\n%s\n' "$title" "$CHANGELOG" >> "$GITHUB_STEP_SUMMARY"

  # the publishes are idempotent: a failure is fixed with "Re-run failed jobs" on the same run
  publish-image:
    needs: tag
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - id: stamp
        uses: ./.github/actions/stamp

      - name: Watermark
        id: watermark
        uses: svaraborut/watermark@v2
        with:
          version: ${{ steps.stamp.outputs.version }}
          format: 'vVERSION #SHA7 DATE'

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: WATERMARK=${{ steps.watermark.outputs.watermark }}
          cache-from: |
            type=gha,scope=dev
            type=gha,scope=runtime

  # Trusted Publishing: PyPI accepts workflow release.yml, environment pypi
  publish-pypi:
    needs: tag
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: ./.github/actions/stamp

      - uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv build --directory sdk/python

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          skip-existing: true

  # Trusted Publishing: npm accepts workflow release.yml, environment npm; it needs npm 11.5.1, Node 24 ships it
  publish-npm:
    needs: tag
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - id: stamp
        uses: ./.github/actions/stamp

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: bun install --frozen-lockfile

      # npm refuses to publish a version twice, so a re-run skips what is already there
      - name: Already published
        id: published
        env:
          VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          if npm view "@axelered/papyrus@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi

      # prepack builds dist
      - name: Publish
        if: ${{ steps.published.outputs.already != 'true' }}
        run: npm publish --provenance --access public

  # only once every artifact exists; a re-run updates the same release
  github-release:
    needs: [tag, publish-image, publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-bundle

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: ${{ needs.tag.outputs.tag }}
          files: docs.tar.gz
          body: |
            ### Install

            - Image: `ghcr.io/${{ github.repository }}:${{ needs.tag.outputs.version }}`
            - Python: `pip install papyrus-sdk==${{ needs.tag.outputs.version }}`
            - TypeScript: `npm install @axelered/papyrus@${{ needs.tag.outputs.version }}`

            ### Changelog
            ${{ needs.tag.outputs.changelog }}
