# Server check: dev image with lint and the full suite, docs bundle, runtime image built but not pushed
# (adr/development.md)
name: server

on:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        id: dev
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: papyrus:dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      # each check below reports even when an earlier one failed, none runs without the dev image
      # sdk is mounted only for Ruff: one config covers the whole repository
      - name: Format
        if: ${{ steps.dev.outcome == 'success' }}
        run: >-
          docker run --rm -v ./server:/app/server:ro -v ./test:/app/test:ro -v ./scripts:/app/scripts:ro
          -v ./sdk:/app/sdk:ro -v ./ruff.toml:/app/ruff.toml:ro papyrus:dev ruff format --check

      - name: Lint
        if: ${{ !cancelled() && steps.dev.outcome == 'success' }}
        run: >-
          docker run --rm -v ./server:/app/server:ro -v ./test:/app/test:ro -v ./scripts:/app/scripts:ro
          -v ./sdk:/app/sdk:ro -v ./ruff.toml:/app/ruff.toml:ro papyrus:dev ruff check

      # -m overrides the addopts filter, without it the LibreOffice tests are silently deselected
      - name: Test
        if: ${{ !cancelled() && steps.dev.outcome == 'success' }}
        run: >-
          docker run --rm --init -v ./server:/app/server:ro -v ./test:/app/test:ro -v ./scripts:/app/scripts:ro
          papyrus:dev pytest -m "not live"

      # docs bundle for docs.axelered.com (axelered-docs skill), packed on every run so a broken export or a leaked
      # Bruno environment fails the check; the release job attaches it
      - name: Docs bundle
        if: ${{ !cancelled() && steps.dev.outcome == 'success' }}
        run: |
          docker run --rm -v ./server:/app/server:ro -v ./scripts:/app/scripts:ro papyrus:dev \
            python scripts/openapi.py > openapi.json
          jq empty openapi.json
          echo '{"format": 1}' > bundle.json
          tar -czf docs.tar.gz --exclude='bruno/environments' --exclude='bruno/.env*' \
            bundle.json openapi.json docs bruno
          if tar -tzf docs.tar.gz | grep -qE '(^|/)(environments/|\.env)'; then
            echo "::error::docs bundle contains Bruno environments or .env files"; exit 1
          fi

      - name: Upload docs bundle
        uses: actions/upload-artifact@v4
        with:
          name: docs-bundle
          path: docs.tar.gz
          retention-days: 7

      # proves the prod image builds and warms the runtime cache for the SDK checks
      - name: Build runtime image
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: |
            type=gha,scope=dev
            type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
