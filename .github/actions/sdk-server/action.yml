# The CI twin of dekit sdk/server: runtime image, authentication on, no config file (adr/sdk-python.md)
name: sdk-server
description: Build the runtime image from cache and start it as the server under test on port 8003

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3

    # the server check wrote both cache scopes, this only reads them
    - name: Build runtime image
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: papyrus
        cache-from: |
          type=gha,scope=dev
          type=gha,scope=runtime

    - name: Start server
      shell: bash
      run: |
        docker run -d --init --name papyrus-sdk -p 8003:8000 -e PAPYRUS_API_KEY=dev papyrus
        curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8003/health
