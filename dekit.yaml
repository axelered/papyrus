tasks:
  install:
    cmd: [ 'uv', 'sync', '--group', 'dev' ]
    type: job

  server:
    cmd: ['uv', 'run', 'fastapi', 'dev', '--entrypoint', 'server:app', '--reload']
    deps: [install]
    ready: { log: 'started at' }
    autostart: true

  # image loop with LibreOffice (adr/development.md); containers are named so stop reaches them on Windows too
  docker/:
    collapsed: true

  docker/build-dev:
    cmd: [ 'docker', 'build', '--target', 'dev', '-t', 'papyrus:dev', '.' ]
    type: job

  docker/dev:
    cmd: [
      'docker', 'run', '--rm', '--init', '--name', 'papyrus-dev', '-p', '8001:8000',
      '-e', 'PAPYRUS_AUTH_DISABLED=true', '-e', 'WATCHFILES_FORCE_POLLING=true',
      '-v', './server:/app/server:ro', '-v', './test:/app/test:ro', '-v', './scripts:/app/scripts:ro',
      'papyrus:dev',
    ]
    deps: [docker/build-dev]
    ready: { http: 'http://localhost:8001/health' }
    stop: { cmd: [ 'docker', 'stop', 'papyrus-dev' ], timeout: 40s }

  docker/build-prod:
    cmd: [ 'docker', 'build', '-t', 'papyrus', '.' ]
    type: job

  docker/prod:
    cmd: [ 'docker', 'run', '--rm', '--init', '--name', 'papyrus-prod', '-p', '8002:8000', '-e', 'PAPYRUS_API_KEY=dev', 'papyrus' ]
    deps: [docker/build-prod]
    ready: { http: 'http://localhost:8002/health' }
    stop: { cmd: [ 'docker', 'stop', 'papyrus-prod' ], timeout: 40s }

  # -m overrides the `not full` addopts filter, without it the LibreOffice tests are silently deselected
  docker/test:
    cmd: [
      'docker', 'run', '--rm', '--init', '--name', 'papyrus-test',
      '-v', './server:/app/server:ro', '-v', './test:/app/test:ro', '-v', './scripts:/app/scripts:ro',
      'papyrus:dev', 'pytest', '-m', 'full or not full',
    ]
    type: job
    deps: [docker/build-dev]
    stop: { cmd: [ 'docker', 'stop', 'papyrus-test' ] }
