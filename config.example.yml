# Papyrus configuration
#
# The server reads this file from the path in the PAPYRUS_CONFIG env variable (default /etc/papyrus/config.yml).
# Every key is optional and the values below are the defaults. Unknown keys stop the server from starting.
# Durations are in seconds. Sizes can use units such as 100MB or 2MiB.
# You can reference env variables in values as ${VAR}. If a referenced variable is not set, the server won't start.
#
# These settings are env variables, not keys in this file:
#   PAPYRUS_API_KEY        API keys accepted by the server, comma separated. Required unless auth is disabled.
#   PAPYRUS_AUTH_DISABLED  Set to true to turn off auth. Use only for local development.
#   PAPYRUS_CONFIG         Path of this file.
#   PAPYRUS_TIMING         Set to true to add a Server-Timing header and a log line with stage durations to every
#                          response. Use only for profiling, the header reveals internal timings.
#   PAPYRUS_LOG_LEVEL      debug, info (default), warning or error. Applies to papyrus loggers only:
#                          uvicorn keeps its --log-level (UVICORN_LOG_LEVEL), libraries log warnings.
#   PAPYRUS_LOG_FORMAT     text (default) or json, one object per line for log pipelines that parse them.

workers:
  # Number of worker processes. "auto" uses one per CPU.
  # LibreOffice conversion uses half as many, at least one, and each needs about 330 MB of RAM.
  processes: auto
  # How many requests a container handles at once. Extra requests get a 503 and should retry later.
  max_queue: 64
  # Start every worker process and the browser at startup, so the first requests don't wait for them.
  # Startup takes a few seconds longer and fails if a component can't start. Turn off for local development.
  warmup: true

limits:
  # Largest file accepted, whether uploaded or downloaded from a source.
  max_file_size: 100MB
  # Maximum time for a whole request, in seconds.
  deadline: 300
  # Folder for temporary files while a request runs. Defaults to a "papyrus" folder in the system temp directory.
  # tmp_dir: /tmp/papyrus

# Downloading documents from http(s) URLs. Also applies to screenshots: the page and everything it loads.
http:
  # Set false to disable all http(s) sources.
  enabled: true
  # Allow URLs that point to private or internal network addresses. Keep this off in production.
  allow_private: false
  # When the list is not empty, only these hostnames can be downloaded from, e.g. [docs.example.com].
  # With shared_links on, also list the hosts the links resolve to, not only the hosts users paste:
  # drive.usercontent.google.com, docs.google.com, dl.dropboxusercontent.com, raw.githubusercontent.com, ...
  allowed_hosts: []
  # Timeout for each download, in seconds.
  timeout: 30
  # Maximum number of redirects to follow, counted across the whole chain.
  max_redirects: 5
  # Download the file behind public share links instead of their viewer page: Google Drive, Docs, Sheets and
  # Slides (exported as docx, xlsx, pptx), Dropbox, OneDrive and SharePoint, GitHub. Links must be shared with
  # anyone who has the link; a link that returns a web page fails with 403. Set false to fetch URLs as given.
  shared_links: true
  # Language asked of remote sites, as a BCP 47 tag such as en-US, it-IT or de. Downloads send it as
  # Accept-Language and screenshots set it as the browser language, so sites that translate serve that version.
  # It does not translate content. Set null to send no language and let each site decide.
  locale: en-US

# Headless Chromium used for screenshots.
browser:
  # Run Chromium inside its sandbox. Needs a container runtime that allows unprivileged user namespaces,
  # which the default Docker seccomp profile blocks. With true and no support, screenshots fail with a 500.
  sandbox: false

# Reading page images with a vision model, for Markdown requests. With it, the default readMode auto sends scans,
# images and presentations to the backend, also from clients that never asked for OCR, and readMode ocr every page.
# Not set by default: auto reads every document as text, ocr is rejected, and no document leaves the server.
# One backend per deployment. Pages are sent to the backend as images, with "mistral" that means a third party.
# Example with a Qwen VL model on any OpenAI compatible server (vLLM, Ollama, OpenRouter):
# ocr:
#   type: qwen
#   # Name of the model on the server. It must accept images.
#   model: Qwen/Qwen3-VL-8B-Instruct
#   # Base URL of the API. Private addresses are allowed.
#   url: http://vllm:8000/v1
#   # Optional.
#   api_key: ${OCR_API_KEY}
#   # Pages read at once by this container. Every replica adds its own.
#   concurrency: 8
#   # Longest document read with OCR: longer ones are read as text in auto and rejected in ocr. Raise
#   # limits.deadline with it: the whole document is read within one request.
#   max_pages: 100
#   # Extra fields sent as is with every request, for options of the server. This one turns off reasoning on vLLM.
#   extra_body:
#     chat_template_kwargs: { enable_thinking: false }
#
# Example with Mistral OCR. It takes concurrency and max_pages too, and an optional url.
# ocr:
#   type: mistral
#   api_key: ${MISTRAL_API_KEY}
#   # Default.
#   model: mistral-ocr-latest

# Browser access from web pages on other origins (CORS). Servers and agents calling the API don't need this.
cors:
  # Origins allowed to call the API from a browser, as scheme://host[:port] without a trailing slash,
  # e.g. [https://app.example.com]. Empty keeps browsers on the same-origin policy.
  # ["*"] lets any web page call the API: the API key still applies, but it has to be present in the browser.
  allow_origins: []

# Storage that requests can read from and write to, addressed as <protocol>://<name>/<path>.
# None are configured by default. Example of an S3 bucket used as s3://prod/<path>:
connectors: {}
#  prod:
#    protocol: s3
#    # Passed as is to the fsspec filesystem, in this case s3fs.
#    options:
#      endpoint_url: https://s3.eu-central-1.amazonaws.com
#      key: ${PROD_S3_KEY}
#      secret: ${PROD_S3_SECRET}
